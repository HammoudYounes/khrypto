version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: khrypto_mongo
    restart: always
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}   
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD} 
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  gateway:
    build: ./services/gateway
    container_name: khrypto_gateway
    restart: always
    ports:
      - "443:8000"
    environment:
      - PORT=8000
      - ENGINE_URL=http://engine:8002
      - FILES_URL=http://files:8001
      - AUTH_URL=http://auth:8003
      - TOKEN_URL=http://token:8004
      - MATCHMAKING_URL=http://matchmaking:8005
      - SOCIAL_URL=http://social:8006
      - MARKET_URL=http://market:8007
    volumes:
      - /etc/letsencrypt/khrypto.ps8.pns.academy:/etc/letsencrypt/khrypto.ps8.pns.academy:ro
    depends_on:
      - engine
      - files
      - auth
      - token
      - matchmaking
      - social
      - market
    networks:
      - app_network

  engine:
    build: ./services/engine
    container_name: khrypto_engine
    restart: always
    expose:
      - "8002"
    environment:
      - PORT=8002
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      - mongo
    networks:
      - app_network

  matchmaking:
    build: ./services/matchmaking
    container_name: khrypto_matchmaking
    restart: always
    expose:
      - "8005"
    environment:
      - PORT=8005
      - ENGINE_URL=http://engine:8002
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      - engine
      - mongo
    networks:
      - app_network

  files:
    build: ./services/files
    container_name: khrypto_files
    restart: always
    expose:
      - "8001"
    environment:
      - PORT=8001
    networks:
      - app_network

  auth:
    build: ./services/auth
    container_name: khrypto_auth
    restart: always
    expose:
      - "8003"
    environment:
      - PORT=8003
      #- MONGO_URL=mongodb://mongo:27017/khrypto
      #- GATEWAY_URL=https://gateway:8000
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin 
      - GATEWAY_URL=https://gateway:8000
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    depends_on:
      - mongo
      - token
    networks:
      - app_network

  token:
    build: ./services/token
    container_name: khrypto_token
    restart: always
    expose:
      - "8004"
    environment:
      - PORT=8004
      #- MONGO_URL=mongodb://mongo:27017/khrypto
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      - mongo
    networks:
      - app_network

  social:
    build: ./services/social
    container_name: khrypto_social
    restart: always
    expose:
      - "8006"
    environment:
      - PORT=8006
      - GATEWAY_URL=https://gateway:8000
      - ENGINE_URL=http://engine:8002
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      - mongo
      - engine
    networks:
      - app_network

  market:
    build: ./services/market
    container_name: khrypto_market
    restart: always
    expose:
      - "8007"
    environment:
      - PORT=8007
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      - mongo
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
