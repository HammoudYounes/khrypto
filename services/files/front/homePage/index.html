<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khrypto</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="preload" href="../assets/khrypto_logo.png" as="image">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="homePage.css">
    <link rel="stylesheet" href="../globalNotif.css">
    <script src="../js/socket.io.js"></script>
    <script src="../js/matrixBackground.js"></script>
    <script type="module" src="homePage.js" defer></script>
</head>

<body>
    <canvas id="matrixCanvas"></canvas>

    <!-- Profile button (desktop: fixed top-right; mobile: compact fixed top-right) -->
    <div class="profile-button-container">
        <button id="profileBtn" class="profile-btn">
            <img id="navAvatarImg" class="nav-avatar-img" src="" alt="">
            <span class="profile-icon" id="profileIconFallback">⬡</span>
            <span id="profileUsername">Guest</span>
            <span class="profile-coin-sep" id="profileCoinSep" style="display:none;">|</span>
            <span class="profile-coin-wrap" id="profileCoinWrap" style="display:none;">
                <span class="profile-coin-icon">◈</span>
                <span id="navCoinBalance">0</span>
            </span>
        </button>
    </div>

    <!-- Profile dropdown panel -->
    <div id="profilePanel" class="profile-panel glass-card">
        <div class="profile-panel-content">
            <h2>Profile</h2>
            <div class="profile-info">
                <p id="usernameDisplay">Username: <span>Guest</span></p>
                <p id="panelBalanceRow" class="panel-balance-row">
                    Balance: <span class="profile-coin-wrap"><span class="profile-coin-icon">◈</span><span id="panelCoinBalance">0</span></span>
                </p>
            </div>
            <button id="goToProfileBtn" class="btn btn-gold" style="margin-bottom: 10px; width: 100%;">My Profile &
                Friends</button>
            <button id="logoutBtn" class="btn btn-danger" style="width: 100%;">Logout</button>
        </div>
    </div>

    <!-- Main content -->
    <div class="home-container">
        <div class="home-main">
            <!-- Panel 0 (mobile) / Fixed left (desktop): Leaderboard -->
            <section class="leaderboard-section glass-card">
                <h2 class="leaderboard-title">🏆 Leaderboard</h2>
                <ol class="leaderboard-list" id="leaderboardList">
                </ol>
            </section>

            <!-- Panel 1 (mobile) / Fixed right (desktop): Global Chat -->
            <section class="chat-section glass-card">
                <h2 class="chat-header">
                    <span class="chat-icon">💬</span> Global Chat
                    <button id="chatCloseBtn" class="chat-close-btn" aria-label="Go back">✕</button>
                </h2>
                <div id="chatMessages" class="chat-messages">
                    <div id="chatLoading" class="chat-loading" style="display:none;">Loading older messages...</div>
                    <p class="chat-empty" id="chatEmpty">No messages yet. Say hello!</p>
                </div>
                <div class="chat-input-bar">
                    <input type="text" id="chatInput" class="input-dark" placeholder="Type a message..." autocomplete="off">
                    <button id="chatSendBtn" class="btn btn-gold chat-send-btn">Send</button>
                </div>
            </section>

            <!-- Panel 2 (mobile) / Center (desktop): game buttons + shop/rules -->
            <div class="home-left">
                <img src="../assets/khrypto_logo.png" alt="KHRYPTO" class="khrypto-logo logo-lg">
                <div class="game-mode-buttons">
                    <button id="localBtn" class="mode-card glass-card">
                        <span class="mode-icon">🎮</span>
                        <span class="mode-label">Local</span>
                    </button>
                    <button id="aiBtn" class="mode-card glass-card">
                        <span class="mode-icon">🤖</span>
                        <span class="mode-label">AI</span>
                    </button>
                    <button id="onlineBtn" class="mode-card glass-card">
                        <span class="mode-icon">🌐</span>
                        <span class="mode-label">Online</span>
                    </button>
                    <button id="rejoinBtn" class="mode-card glass-card" style="display:none;">
                        <span class="mode-icon">🔄</span>
                        <span class="mode-label">Rejoin game</span>
                        <span id="rejoinCountdown" class="mode-sublabel"></span>
                    </button>
                </div>

                <div class="home-left-links">
                    <a href="../rulesPage/index.html" class="rules-card glass-card" id="rulesNavBtn">
                        <span class="rules-card-icon">📜</span>
                        <span class="rules-card-label">How to Play</span>
                    </a>
                </div>
            </div>

            <!-- Panel 3 (mobile): Shop embedded -->
            <div class="shop-panel" id="panelShop">
                <!-- Thin overlay captures swipe-right to exit the panel (touches inside iframe don't bubble) -->
                <div class="shop-swipe-edge" id="shopSwipeEdge"></div>
                <iframe id="shopIframe" class="shop-iframe" title="Shop"></iframe>
            </div>
        </div>
    </div>

    <!-- Mobile bottom navigation bar (hidden on desktop via CSS) -->
    <nav class="mobile-bottom-nav" id="mobileBottomNav">
        <button class="nav-tab" id="navLeaderboardBtn">
            <span class="nav-tab-icon">🏆</span>
            <span class="nav-tab-label">Leaderboard</span>
        </button>
        <button class="nav-tab" id="navChatBtn">
            <span class="nav-tab-icon">💬</span>
            <span class="nav-tab-label">Chat</span>
        </button>
        <button class="nav-tab nav-tab-home active" id="navHomeBtn">
            <span class="nav-tab-icon">🏠</span>
            <span class="nav-tab-label">Home</span>
        </button>
        <button class="nav-tab" id="navShopBtn">
            <span class="nav-tab-icon">🛒</span>
            <span class="nav-tab-label">Shop</span>
        </button>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initMatrixBackground('matrixCanvas');
        });
    </script>
</body>

</html>
