<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Khrypto</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="preload" href="../assets/khrypto_logo.png" as="image">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="gamePage.css">
    <link rel="stylesheet" href="../globalNotif.css">
    <script src="../js/socket.io.js"></script>
    <script src="../js/matrixBackground.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
    <script type="module" src="index.js" defer></script>
</head>

<body>
    <canvas id="matrixCanvas"></canvas>

    <header>
        <img src="../assets/khrypto_logo.png" alt="KHRYPTO" class="khrypto-logo logo-sm">
        <button id="emoteToggleBtn" class="btn btn-ghost emote-toggle-btn" title="Emotes">☺</button>
        <button id="leaveBtn" class="btn btn-danger">Leave Game</button>
    </header>

    <main>
        <!-- Mobile-only info bar (names, ELO, potential) — hidden on desktop -->
        <div class="mobile-info-bar">
            <div class="mobile-player-strip" id="mobile-strip-p2">
                <span class="m-player-name" id="m-p2-name">Player 2</span>
                <span class="m-player-elo" id="m-p2-elo"></span>
                <div class="m-player-potential" id="m-p2-potential"></div>
            </div>
            <div class="mobile-player-strip" id="mobile-strip-p1">
                <span class="m-player-name" id="m-p1-name">Player 1</span>
                <span class="m-player-elo" id="m-p1-elo"></span>
                <div class="m-player-potential" id="m-p1-potential"></div>
            </div>
        </div>

        <!-- Left: Player Info -->
        <div class="player-info-sec">
            <div class="opposing-player glass-card">
                <img id="p2-avatar" class="player-avatar" src="" alt="">
                <p class="player-label">Player 2 <span id="p2-elo" class="player-elo"></span></p>
                <div id="p2-elo-potential" class="player-elo-potential"></div>
                <div class="player-preview-cell">
                    <img id="p2-reserve-piece" src="assets/red_pyramid.png" alt="red_pyramid" class="piece-image">
                </div>
                <div class="reserve-controls">
                    <button id="btn-p2-left" class="btn btn-ghost btn-sm">↺</button>
                    <button id="btn-p2-right" class="btn btn-ghost btn-sm">↻</button>
                </div>
                <p class="pyramid-count" id="p2-pyramid-count">0</p>
                <div class="cooldown-info">
                    <p>Sphinx Cooldown: <span id="p2-sphinx-cooldown">0</span></p>
                    <p>Pharaoh Cooldown: <span id="p2-pharaoh-cooldown">0</span></p>
                </div>
            </div>

            <div class="current-player glass-card">
                <img id="p1-avatar" class="player-avatar" src="" alt="">
                <p class="player-label">Player 1 <span id="p1-elo" class="player-elo"></span></p>
                <div id="p1-elo-potential" class="player-elo-potential"></div>
                <div class="player-preview-cell">
                    <img id="p1-reserve-piece" src="assets/green_pyramid.png" alt="green_pyramid" class="piece-image">
                </div>
                <div class="reserve-controls">
                    <button id="btn-p1-left" class="btn btn-ghost btn-sm">↺</button>
                    <button id="btn-p1-right" class="btn btn-ghost btn-sm">↻</button>
                </div>
                <p class="pyramid-count" id="p1-pyramid-count">0</p>
                <div class="cooldown-info">
                    <p>Sphinx Cooldown: <span id="p1-sphinx-cooldown">0</span></p>
                    <p>Pharaoh Cooldown: <span id="p1-pharaoh-cooldown">0</span></p>
                </div>
            </div>
        </div>

        <!-- Center: Game Board -->
        <div class="game-sec">
            <div class="board-wrapper">
                <div id="board"></div>
                <canvas id="laserCanvas"></canvas>
            </div>
            <div class="rot-buttons">
                <button id="btn-rotate-left" class="action-btn btn btn-ghost" disabled>↺</button>
                <button id="btn-rotate-right" class="action-btn btn btn-ghost" disabled>↻</button>
            </div>
        </div>

        <!-- Right: Emote Chat -->
        <div class="chat-moves-sec">
            <div class="emote-chat glass-card">
                <h3 class="emote-chat-title">Emotes</h3>
                <div id="emoteDisplay" class="emote-display">
                    <p class="emote-empty" id="emoteEmpty">No emotes yet</p>
                </div>
                <!-- Filled dynamically by JS from inventory -->
                <div class="emote-picker" id="emotePicker"></div>
            </div>
        </div>
    </main>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal-overlay">
        <div class="modal-content glass-card">
            <h2 id="victoryMessage"></h2>
            <p id="voteStatus"></p>
            <div class="modal-actions">
                <button id="restartBtn" class="btn btn-gold">Replay</button>
                <button id="leaveModalBtn" class="btn btn-danger">Leave</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initMatrixBackground('matrixCanvas');

            // ── Sync mobile info bar from desktop elements ──
            function mirrorEl(srcId, destId) {
                const src = document.getElementById(srcId);
                const dest = document.getElementById(destId);
                if (!src || !dest) return;
                const update = () => {
                    dest.innerHTML = src.innerHTML;
                    dest.style.display = src.style.display || '';
                };
                update();
                new MutationObserver(update).observe(src, {
                    childList: true, subtree: true, characterData: true, attributes: true
                });
            }

            mirrorEl('p1-elo', 'm-p1-elo');
            mirrorEl('p2-elo', 'm-p2-elo');
            mirrorEl('p1-elo-potential', 'm-p1-potential');
            mirrorEl('p2-elo-potential', 'm-p2-potential');

            // Sync player name text nodes (updated by JS via firstChild.textContent)
            function syncName(labelSelector, destId) {
                const label = document.querySelector(labelSelector);
                const dest = document.getElementById(destId);
                if (!label || !dest) return;
                const update = () => {
                    dest.textContent = label.firstChild?.textContent?.trim() || dest.textContent;
                };
                update();
                new MutationObserver(update).observe(label, {
                    childList: true, subtree: true, characterData: true
                });
            }

            syncName('.opposing-player .player-label', 'm-p2-name');
            syncName('.current-player .player-label', 'm-p1-name');
        });
    </script>
</body>

</html>
