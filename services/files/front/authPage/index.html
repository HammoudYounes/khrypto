<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khrypto - Auth</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="auth.css">
    <script src="../js/matrixBackground.js"></script>
    <script type="module" src="auth.js" defer></script>
</head>

<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="auth-container">
        <div class="auth-card glass-card">
            <img src="../assets/khrypto_logo.png" alt="KHRYPTO" class="khrypto-logo">

            <!-- Mode Toggle Buttons -->
            <div class="mode-toggle">
                <button id="loginBtn" class="toggle-btn active">Login</button>
                <button id="registerBtn" class="toggle-btn">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <h2>Login</h2>

                <div class="form-group">
                    <label for="loginIdentifier">Username or Email</label>
                    <input type="text" id="loginIdentifier" name="identifier" class="input-dark"
                        placeholder="Enter username or email" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" class="input-dark"
                        placeholder="Enter password" required>
                </div>

                <button type="button" id="forgotPasswordBtn" class="forgot-password-btn">Forgot Password?</button>

                <button type="submit" class="submit-btn btn btn-gold">Login</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <h2>Register</h2>

                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" name="username" class="input-dark"
                        placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" name="email" class="input-dark" placeholder="Enter email"
                        required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" name="password" class="input-dark"
                        placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label for="registerPasswordConfirm">Confirm Password</label>
                    <input type="password" id="registerPasswordConfirm" name="passwordConfirm" class="input-dark"
                        placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="submit-btn btn btn-gold">Register</button>
            </form>
        </div>

        <div class="guest-divider"><span>or</span></div>
        <button id="guestBtn" class="guest-btn">Play as Guest</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initMatrixBackground('matrixCanvas');
        });
    </script>
</body>

</html>
